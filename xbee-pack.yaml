schema-version: 1.0

description: |
  Installs Apache Tomcat 11.0.22 from a versioned archive.
  The SHA-256 below was computed after checking the downloaded archive
  against the SHA-512 published by Apache at:
  https://archive.apache.org/dist/tomcat/tomcat-11/v11.0.22/bin/apache-tomcat-11.0.22.tar.gz.sha512
  Changing xbee.version requires updating archiveSha256 as well.
  Requires an xbee guest binary supporting url.sha256.

dependency:
  origin: aws-jdk
  alias: jdk

const:
  httpPort: 8080
  catalinaHome: "{{ .xbee.install }}/apache-tomcat-{{ .xbee.version }}"

var:
  xbee:
    version: 11.0.22
  archiveSha256: 73d239232f14dfde2278e8d931f767ed454aed9b018e4d70a1d404c2579b5998
  timeout: 30

provision:
  - url:
      from: https://archive.apache.org/dist/tomcat/tomcat-{{ majorVersion .xbee.version }}/v{{ .xbee.version }}/bin/apache-tomcat-{{ .xbee.version }}.tar.gz
      sha256: '{{ .archiveSha256 }}'
  - env: CATALINA_HOME={{ .catalinaHome }}
  - env: CATALINA_PID=/tmp/catalina.pid
  - systempath: "{{ .catalinaHome }}/bin"
  - permission:
      path: "{{ .catalinaHome }}"
      owner: "{{ .xbee.user }}"
      recursive: true
  - shell: rm -rf $CATALINA_HOME/webapps/*

up: catalina.sh start
down: catalina.sh stop {{ .timeout }} -force


port: "{{ .httpPort }}"


command:
  catalina: catalina.sh {{ .args }}
